name: Hosted mathematics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-mathematics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVIEW_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install capture dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/hosted-dependencies" --ignore-scripts --no-audit --no-fund playwright@1.56.1 mathjax-full@3.2.1
          "$RUNNER_TEMP/hosted-dependencies/node_modules/.bin/playwright" install --with-deps chromium --only-shell
      - name: Capture and compare actual GitHub mathematics
        run: |
          NODE_PATH="$RUNNER_TEMP/hosted-dependencies/node_modules" node verification/hosted/capture_hosted_math.cjs \
            --root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$REVIEW_SHA" \
            --output "$RUNNER_TEMP/hosted-capture"
      - name: Retain review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-math-${{ env.REVIEW_SHA }}
          path: ${{ runner.temp }}/hosted-capture
          if-no-files-found: error
          retention-days: 14
